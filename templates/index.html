<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Queue Live-Look-In</title>
	<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
	<header class="header">
		<img src="/static/sql-logo.svg" alt="SQL Logo" class="header-logo-left" />
		<div class="header-right">
			<button id="refresh-btn" class="refresh-button" title="Refresh metrics">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="23 4 23 10 17 10"></polyline>
					<polyline points="1 20 1 14 7 14"></polyline>
					<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
				</svg>
			</button>
			<img src="/static/support-queue-live.svg" alt="Support Queue Live" class="header-logo-right" />
		</div>
	</header>

	<div id="error" style="display:none; margin:12px auto; max-width:1200px; padding:10px 14px; border-radius:10px; background:#3b0a0a; color:#ffd4d4; border:1px solid #8a1f1f;">
	</div>

	<main class="container">
		<div class="nav-buttons">
			<a href="/tse" class="nav-button">View TSE Table</a>
		</div>
		
		<section class="kpis">
			<div class="kpi-card kpi-waiting kpi-waiting-featured" id="kpi-waiting-card">
				<div class="kpi-title">Waiting 1st Reply</div>
				<div class="kpi-value kpi-waiting-value" id="kpi-waiting">—</div>
			</div>
			<div class="kpi-card kpi-open">
				<div class="kpi-title">Open</div>
				<div class="kpi-value" id="kpi-open">—</div>
			</div>
			<div class="kpi-card kpi-snoozed">
				<div class="kpi-title">Snoozed</div>
				<div class="kpi-value" id="kpi-snoozed">—</div>
			</div>
			<div class="kpi-card kpi-unassigned">
				<div class="kpi-title">Unassigned</div>
				<div class="kpi-value" id="kpi-unassigned">—</div>
			</div>
		</section>

		<section class="stats-grid">
			<div class="panel">
				<div class="panel-title">Wait Times</div>
				<div class="metric-row">
					<div class="metric">
						<div class="metric-label">Average</div>
						<div class="metric-value" id="wait-avg">—</div>
					</div>
					<div class="metric">
						<div class="metric-label">P95</div>
						<div class="metric-value" id="wait-p95">—</div>
					</div>
				</div>
			</div>
			<div class="panel">
				<div class="panel-title">SLA (First Response ≤ <span id="sla-min">—</span>m)</div>
				<div class="metric-row">
					<div class="metric">
						<div class="metric-label">Adherence</div>
						<div class="metric-value" id="sla-pct">—</div>
					</div>
					<div class="metric">
						<div class="metric-label">Sample</div>
						<div class="metric-value" id="sla-sample">—</div>
					</div>
				</div>
			</div>
			<div class="panel">
				<div class="panel-title">Ratings</div>
				<div class="ratings-container">
					<div class="gauge-wrapper">
						<svg class="gauge" viewBox="0 0 200 120" id="ratings-gauge">
							<!-- Background arc -->
							<path d="M 20 100 A 80 80 0 0 1 180 100" 
								fill="none" 
								stroke="rgba(255,255,255,0.1)" 
								stroke-width="12" 
								stroke-linecap="round"/>
							<!-- Value arc (will be updated dynamically) -->
							<path id="gauge-arc" 
								d="M 20 100 A 80 80 0 0 1 180 100" 
								fill="none" 
								stroke="#4cec8c" 
								stroke-width="12" 
								stroke-linecap="round"
								stroke-dasharray="251.327"
								stroke-dashoffset="251.327"/>
							<!-- Center text -->
							<text x="100" y="85" text-anchor="middle" class="gauge-value" id="gauge-percent">—</text>
							<text x="100" y="105" text-anchor="middle" class="gauge-label">Satisfaction</text>
						</svg>
					</div>
					<div class="ratings-stats">
						<div class="rating-stat">
							<div class="rating-stat-label">Rated</div>
							<div class="rating-stat-value" id="rated">—</div>
						</div>
						<div class="rating-stat">
							<div class="rating-stat-label">Positive</div>
							<div class="rating-stat-value positive" id="rated-pos">—</div>
						</div>
						<div class="rating-stat">
							<div class="rating-stat-label">Negative</div>
							<div class="rating-stat-value negative" id="rated-neg">—</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script>
		const teamId = {{ team_id }};
		const refreshIntervalSeconds = {{ refresh_interval }};

		async function fetchMetrics() {
			const res = await fetch(`/api/metrics?team_id=${teamId}`, { cache: "no-store" });
			let payload = null;
			try { payload = await res.json(); } catch (_) { /* ignore non-JSON */ }
			if (!res.ok) {
				const msg = (payload && (payload.detail || payload.error)) || `${res.status} ${res.statusText}`;
				throw new Error(msg);
			}
			return payload || {};
		}

		function setText(id, value) {
			document.getElementById(id).textContent = value;
		}


		function updateRatingsGauge(ratings) {
			const gaugeArc = document.getElementById("gauge-arc");
			const gaugePercent = document.getElementById("gauge-percent");
			const totalRated = ratings.num_rated || 0;
			const positive = ratings.positive || 0;
			
			// Arc circumference for semicircle: π * radius (radius = 80)
			const circumference = Math.PI * 80;
			
			if (totalRated === 0) {
				gaugePercent.textContent = "—";
				gaugeArc.style.strokeDashoffset = circumference.toString();
				return;
			}
			
			const percent = (positive / totalRated) * 100;
			const offset = circumference - (percent / 100) * circumference;
			
			gaugeArc.style.strokeDashoffset = offset.toString();
			gaugePercent.textContent = Math.round(percent) + "%";
			
			// Update gauge color based on satisfaction level
			if (percent >= 80) {
				gaugeArc.setAttribute("stroke", "#4cec8c"); // Green
			} else if (percent >= 60) {
				gaugeArc.setAttribute("stroke", "#efff45"); // Yellow
			} else {
				gaugeArc.setAttribute("stroke", "#fd8789"); // Red
			}
		}

		async function hydrate() {
			try {
				const data = await fetchMetrics();
				document.getElementById("error").style.display = "none";

				setText("kpi-open", data.totals.open);
				setText("kpi-snoozed", data.totals.snoozed);
				setText("kpi-unassigned", data.totals.unassigned_open);
				
				// Update waiting tile with conditional coloring
				const waitingValue = data.totals.waiting_first_reply;
				setText("kpi-waiting", waitingValue);
				const waitingCard = document.getElementById("kpi-waiting-card");
				const waitingValueEl = document.getElementById("kpi-waiting");
				waitingCard.classList.remove("kpi-waiting-green", "kpi-waiting-yellow", "kpi-waiting-red");
				waitingValueEl.classList.remove("kpi-waiting-green", "kpi-waiting-yellow", "kpi-waiting-red");
				if (waitingValue <= 2) {
					waitingCard.classList.add("kpi-waiting-green");
					waitingValueEl.classList.add("kpi-waiting-green");
				} else if (waitingValue <= 4) {
					waitingCard.classList.add("kpi-waiting-yellow");
					waitingValueEl.classList.add("kpi-waiting-yellow");
				} else {
					waitingCard.classList.add("kpi-waiting-red");
					waitingValueEl.classList.add("kpi-waiting-red");
				}

				setText("wait-avg", data.wait_times.average_minutes + "m");
				setText("wait-p95", data.wait_times.p95_minutes + "m");

				setText("sla-min", data.sla.first_response_minutes);
				setText("sla-pct", data.sla.adherence_percent + "%");
				setText("sla-sample", data.sla.sample_size);

				setText("rated", data.ratings.num_rated);
				setText("rated-pos", data.ratings.positive);
				setText("rated-neg", data.ratings.negative);
				
				// Update gauge visualization
				updateRatingsGauge(data.ratings);

			} catch (err) {
				console.error(err);
				const el = document.getElementById("error");
				el.textContent = "Error loading metrics. " + (err && err.message ? err.message : "");
				el.style.display = "block";
			}
		}

		// Set up refresh button
		document.getElementById("refresh-btn").addEventListener("click", () => {
			hydrate();
		});

		hydrate();
		setInterval(hydrate, refreshIntervalSeconds * 1000);
	</script>
</body>
</html>
